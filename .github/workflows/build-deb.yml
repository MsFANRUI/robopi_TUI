name: Build RoboPi TUI Deb Package

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Tag vs changelog version check
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        DEBIAN_VERSION=$(dpkg-parsechangelog -S Version)
        CHANGELOG_VERSION=${DEBIAN_VERSION%%-*}

        echo "Tag version:       $TAG_VERSION"
        echo "Changelog version: $CHANGELOG_VERSION"

        if [ "$TAG_VERSION" != "$CHANGELOG_VERSION" ]; then
          echo "::error::Version mismatch! tag=v$TAG_VERSION, changelog=$CHANGELOG_VERSION"
          exit 1
        fi

        echo "Tag matches changelog: v$TAG_VERSION"

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential debhelper python3-yaml

    - name: Build Debian package
      run: |
        dpkg-buildpackage -us -uc -b

        DEBIAN_VERSION=$(dpkg-parsechangelog -S Version)
        VERSION=${DEBIAN_VERSION%%-*}
        mv "../robopi-tui_${DEBIAN_VERSION}_all.deb" .

        echo "PKG_VERSION=$VERSION" >> $GITHUB_ENV
        ls -l robopi-tui_*_all.deb

    - name: Verify package layout
      run: |
        set -eu
        deb=$(find . -maxdepth 1 -name 'robopi-tui_*_all.deb' -print -quit)
        test -n "$deb"
        test ! -e package-root
        mkdir package-root
        dpkg-deb -x "$deb" package-root
        test -x package-root/opt/roboparty/bin/robopi-tui
        test -L package-root/usr/bin/robopi-tui
        test -f package-root/opt/roboparty/lib/robopi-tui/loader/plugin_executor.py
        test -f package-root/opt/roboparty/lib/robopi-tui/plugins/001-board_temperature.py
        test -f package-root/opt/roboparty/share/doc/robopi-tui/changelog
        test -f package-root/opt/roboparty/share/doc/robopi-tui/plugins/README.md
        test ! -e package-root/usr/sbin/robopi-tui
        test ! -d package-root/usr/lib/robopi-tui
        test "$(dpkg-deb -f "$deb" Architecture)" = "all"
        package-root/opt/roboparty/bin/robopi-tui --version
        # Non-arm64 hosts must expose only generic plugins.
        RP_TUI_GENERIC=1 python3 \
          package-root/opt/roboparty/lib/robopi-tui/loader/plugin_executor.py \
          --list --no-save > generic.json
        python3 - <<'PY'
        import json
        data = json.load(open('generic.json'))
        assert data['tests'], 'no generic plugins listed'
        assert all(test['generic'] for test in data['tests']), 'non-generic plugin listed'
        print('generic plugins:', len(data['tests']))
        PY

    - name: Upload Debian package
      uses: actions/upload-artifact@v4
      with:
        name: robopi-tui-v${{ env.PKG_VERSION }}-all
        path: |
          robopi-tui_*_all.deb

    - name: Upload to GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          robopi-tui_*_all.deb
